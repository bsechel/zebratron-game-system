[package]
name = "zebratron-runtime-native"
version = "0.1.0"
edition = "2021"
description = "Native Raspberry Pi/Desktop runtime for ZebratronGameSystem"

[dependencies]
zebratron-core = { path = "../core", default-features = false, features = ["native"] }
minifb = "0.25"
cpal = "0.15"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
image = "0.24"
# gilrs = "0.10" # Gamepad support (can add later)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
